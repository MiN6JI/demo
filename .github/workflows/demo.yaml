name: Manual Work
on: 
  workflow_dispatch: 
    inputs:
      params1:
        description: "Description for params1"
        required: true
        default: 'Hello World'
jobs:
  run-manual-task:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Respository
          uses: actions/checkout@v4
        - name: Info
          run: |
            echo "Running Manually: ${{github.event.inputs.params1}}"
  
